<style>
:root {
  --bg: #f4f7f7; --surface: #ffffff; --text: #16232b; --muted: #55666e; --line: #d9e2e4;
  --accent: #17796d; --accent-ink: #ffffff; --accent-soft: #e1f2ef;
  --ok: #1a7f4a; --ok-soft: #dff3e6; --bad: #b83247; --bad-soft: #fbe3e7;
  --warn: #8a5a0b; --warn-soft: #fcefd0; --stamp: #b9380b; --shadow: 0 1px 2px rgba(10, 30, 40, .06), 0 4px 14px rgba(10, 30, 40, .05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e171b; --surface: #16222a; --text: #e8eef0; --muted: #9bafb7; --line: #2a3b44;
    --accent: #3fc6b4; --accent-ink: #052320; --accent-soft: #14393a;
    --ok: #52cf8b; --ok-soft: #143626; --bad: #ff8294; --bad-soft: #3d1a22;
    --warn: #f0bd5c; --warn-soft: #3a2d12; --stamp: #ff9163; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e171b; --surface: #16222a; --text: #e8eef0; --muted: #9bafb7; --line: #2a3b44;
  --accent: #3fc6b4; --accent-ink: #052320; --accent-soft: #14393a;
  --ok: #52cf8b; --ok-soft: #143626; --bad: #ff8294; --bad-soft: #3d1a22;
  --warn: #f0bd5c; --warn-soft: #3a2d12; --stamp: #ff9163; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { color-scheme: light dark; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.app { max-width: 720px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 104px max(16px, env(safe-area-inset-left, 0px)); }
h1, h2, h3 { line-height: 1.2; margin: 0 0 8px; }
h1 { font-size: 1.55rem; } h2 { font-size: 1.2rem; } h3 { font-size: 1.02rem; }
p { margin: 0 0 10px; }
em { font-style: italic; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.hdr { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.logo { width: 44px; height: 44px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 800; font-size: 1.05rem; letter-spacing: .5px; flex: none; }
.hdr h1 { margin: 0; font-size: 1.25rem; }
.hdr p { margin: 0; font-size: .86rem; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 0 0 12px; box-shadow: var(--shadow); }
.card.tight { padding: 12px 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 12px; padding: 12px 16px; font: inherit; font-weight: 600; cursor: pointer; min-height: 46px; text-align: center; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 38px; padding: 8px 12px; font-size: .9rem; }
.btn.block { display: block; width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.chip { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .76rem; font-weight: 700; background: var(--accent-soft); color: var(--accent); letter-spacing: .2px; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.plain { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.bar.ok > i { background: var(--ok); }
.opts { display: grid; gap: 8px; margin-top: 12px; }
.opt { appearance: none; text-align: left; border: 2px solid var(--line); background: var(--surface); color: var(--text); border-radius: 12px; padding: 12px 14px; font: inherit; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; min-height: 48px; }
.opt b { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: .78rem; margin-top: 1px; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt[disabled] { cursor: default; }
.q { font-size: 1.12rem; font-weight: 600; margin: 8px 0 0; white-space: pre-wrap; }
input[type=text], select, textarea { font: inherit; color: var(--text); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; width: 100%; }
input[type=text]:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
select { padding: 10px 12px; width: auto; max-width: 100%; }
textarea.editor { min-height: 260px; line-height: 1.55; resize: vertical; }
.fb { margin-top: 12px; padding: 12px 14px; border-radius: 12px; font-size: .96rem; }
.fb.ok { background: var(--ok-soft); color: var(--text); border: 1px solid var(--ok); }
.fb.bad { background: var(--bad-soft); color: var(--text); border: 1px solid var(--bad); }
.fb b { display: block; margin-bottom: 2px; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(4px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px)); z-index: 5; }
.nav button { flex: 1; appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: .7rem; font-weight: 600; padding: 4px 0; cursor: pointer; display: grid; gap: 1px; justify-items: center; }
.nav button span { font-size: 1.35rem; line-height: 1.2; }
.nav button.on { color: var(--accent); }
.passport { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 10px; }
.stampbox { border: 2px dashed var(--line); border-radius: 12px; padding: 8px 4px 6px; text-align: center; font-size: .7rem; font-weight: 700; color: var(--muted); min-height: 86px; display: grid; align-content: space-between; justify-items: center; gap: 4px; }
.stampbox .ic { font-size: 1.4rem; }
.stampbox.done { border-style: solid; border-color: var(--stamp); color: var(--stamp); transform: rotate(-3deg); background: color-mix(in srgb, var(--stamp) 8%, transparent); }
.stampbox .bar { width: 100%; height: 5px; }
.stamp { display: inline-block; border: 4px double var(--stamp); color: var(--stamp); border-radius: 10px; padding: 6px 16px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; transform: rotate(-6deg); animation: pop .5s ease-out; }
@keyframes pop { from { transform: scale(2) rotate(-14deg); opacity: 0; } to { transform: scale(1) rotate(-6deg); opacity: 1; } }
.score { font-size: 2.6rem; font-weight: 800; line-height: 1; }
.todo { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); }
.todo:last-child { border-bottom: 0; }
.todo input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.todo.done span { text-decoration: line-through; color: var(--muted); }
.list > button { width: 100%; text-align: left; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; margin-bottom: 8px; cursor: pointer; font: inherit; color: inherit; width: 100%; text-align: left; }
.item .grow b { display: block; }
.passage { white-space: pre-wrap; background: var(--accent-soft); border-radius: 12px; padding: 14px; margin: 8px 0 12px; font-size: 1.02rem; line-height: 1.6; }
.passage .gapn { display: inline-block; min-width: 1.6em; text-align: center; background: var(--surface); border: 1px solid var(--accent); color: var(--accent); border-radius: 6px; font-weight: 800; font-size: .8rem; padding: 0 5px; }
.sentlist { margin: 6px 0 12px; padding: 0; list-style: none; display: grid; gap: 6px; }
.sentlist li { display: flex; gap: 8px; }
.sentlist b { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: .78rem; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; min-width: 88px; }
.stat b { display: block; font-size: 1.2rem; line-height: 1.2; }
.stat span { font-size: .74rem; color: var(--muted); }
.stat.ok { border-color: var(--ok); } .stat.bad { border-color: var(--bad); }
.issue { display: flex; gap: 8px; padding: 8px 10px; border-radius: 10px; background: var(--bad-soft); margin: 6px 0; font-size: .92rem; }
.issue.tip { background: var(--warn-soft); }
.issue code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .88rem; background: rgba(127, 127, 127, .18); padding: 0 4px; border-radius: 4px; }
.phr { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.phr button { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px; padding: 6px 11px; font: inherit; font-size: .84rem; cursor: pointer; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.tabs button { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: .86rem; font-weight: 600; cursor: pointer; }
.tabs button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.big-timer { font-size: 3rem; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; }
.big-timer.low { color: var(--bad); }
.scene { font-size: 3rem; text-align: center; letter-spacing: 6px; padding: 8px 0; }
.flash { min-height: 190px; display: grid; place-items: center; text-align: center; cursor: pointer; padding: 22px; }
.flash .front { font-size: 1.7rem; font-weight: 700; }
.flash .ex { color: var(--muted); font-style: italic; margin-top: 8px; }
.flash .hint { color: var(--muted); font-size: .85rem; }
details { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; background: var(--surface); }
details summary { cursor: pointer; font-weight: 700; }
details[open] summary { margin-bottom: 6px; }
details ul, details ol { margin: 4px 0 4px 18px; padding: 0; }
audio { width: 100%; margin-top: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.hide { display: none !important; }
.transcript { white-space: pre-wrap; font-size: .95rem; background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; margin-top: 10px; }
.match-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
.match-row label { flex: none; width: 88px; font-weight: 600; }
.match-row select { flex: 1; }
@media (min-width: 640px) { .app { padding-top: 28px; } .passport { gap: 12px; } }

</style>

<body>
<main id="main" class="app"><noscript>Esta app necesita JavaScript.</noscript></main>
<nav class="nav" aria-label="Secciones">
  <button data-tab="home"><span aria-hidden="true">🏠</span>Hoy</button>
  <button data-tab="quiz"><span aria-hidden="true">📝</span>Quiz</button>
  <button data-tab="listen"><span aria-hidden="true">🎧</span>Listening</button>
  <button data-tab="write"><span aria-hidden="true">✍️</span>Writing</button>
  <button data-tab="speak"><span aria-hidden="true">🎤</span>Speaking</button>
  <button data-tab="cards"><span aria-hidden="true">🃏</span>Cartas</button>
</nav>
<script>
(function () {
'use strict';
/* ===== Banco de preguntas (Use of English / Reading). Preguntas originales, no son del examen. ===== */
const TOPICS = {
  tiempos: 'Tiempos verbales',
  condicionales: 'Condicionales',
  prep: 'Preposiciones',
  phrasal: 'Phrasal verbs',
  colocaciones: 'Colocaciones',
  conectores: 'Conectores',
  patrones: 'Verb patterns (-ing / to)',
  relativos: 'Relativos y pasiva',
  falsos: 'Falsos amigos',
  errores: 'Errores típicos',
  vocab: 'Vocabulario'
};
const QUIZ = [];
let _qn = 0;
const mc = (topic, level, q, opts, ans, why) => QUIZ.push({ id: 'q' + (++_qn), type: 'mc', topic, level, q, opts, ans, why });
const gp = (topic, level, q, answers, why) => QUIZ.push({ id: 'q' + (++_qn), type: 'gap', topic, level, q, answers, why });
const WHICH = 'Which sentence is correct?';

/* --- Tiempos verbales --- */
mc('tiempos', 'B1', 'I ____ in Madrid since 2019.', ['live', 'have lived', 'am living', 'lived'], 1, 'Con *since* + momento de inicio se usa present perfect: *have lived*.');
mc('tiempos', 'B1', 'When we arrived, the film ____.', ['had already started', 'already starts', 'was already start', 'has already started'], 0, 'Acción anterior a otra acción pasada: past perfect (*had started*).');
mc('tiempos', 'B1', 'Look at those black clouds! It ____ rain.', ['is going to', 'rains', 'rained', 'has rained'], 0, 'Hay evidencia en el presente, así que se usa *going to*.');
mc('tiempos', 'B1', 'She ____ TV when the phone rang.', ['watched', 'was watching', 'has watched', 'is watching'], 1, 'Acción en curso interrumpida por otra: past continuous.');
gp('tiempos', 'B1', "I haven't seen Tom ____ last Monday.", ['since'], '*Since* + momento de inicio. Con una duración se usa *for*.');
gp('tiempos', 'B1', 'We have known each other ____ ten years.', ['for'], '*For* + duración. Con un momento concreto se usa *since*.');
mc('tiempos', 'B2', 'By the time we reached the station, the train ____.', ['left', 'had left', 'has left', 'was leaving'], 1, 'Acción anterior a otro momento pasado: past perfect (*had left*).');
mc('tiempos', 'B1', 'Have you ever ____ sushi?', ['ate', 'eaten', 'eat', 'eating'], 1, 'Present perfect: *have* + participio (*eaten*).');
mc('tiempos', 'B2', 'Yesterday she said she ____ very tired.', ['is', 'was', 'has been', 'will be'], 1, 'Estilo indirecto: el verbo retrocede un tiempo (*is* pasa a *was*).');
mc('tiempos', 'A2', 'At the moment, my brother ____ a shower.', ['has', 'is having', 'have', 'having'], 1, 'Acción en curso ahora: present continuous (*is having*).');
mc('tiempos', 'A2', 'I ____ to the gym every Monday and Thursday.', ['go', 'am going', 'have gone', 'went'], 0, 'Rutina habitual: present simple.');
mc('tiempos', 'B2', "I'm exhausted. I ____ since six o'clock this morning.", ['work', 'am working', 'have been working', 'worked'], 2, 'Acción que empezó en el pasado y sigue, con *since*: present perfect continuous.');

/* --- Condicionales --- */
mc('condicionales', 'B1', "If it ____ tomorrow, we'll stay at home.", ['will rain', 'rains', 'rained', 'would rain'], 1, 'Primer condicional: *if* + presente, *will* + infinitivo. Tras *if* no se usa *will*.');
mc('condicionales', 'B2', 'If I had more money, I ____ a bigger flat.', ['will rent', 'would rent', 'rented', 'would have rented'], 1, 'Segundo condicional: *if* + pasado, *would* + infinitivo.');
mc('condicionales', 'B2', 'If she had studied harder, she ____ the exam.', ['would pass', 'would have passed', 'will pass', 'passed'], 1, 'Tercer condicional (pasado irreal): *if* + past perfect, *would have* + participio.');
mc('condicionales', 'B2', 'I wish I ____ more free time.', ['have', 'had', 'would have', 'will have'], 1, '*Wish* + pasado para deseos sobre el presente.');
mc('condicionales', 'B2', '____ you leave now, you will miss the bus.', ['If', 'Unless', 'When', 'Although'], 1, '*Unless* = *if not* (a menos que). Se usa con presente.');
gp('condicionales', 'B2', 'If I ____ (know) about the party, I would have gone.', ['had known'], 'Tercer condicional: *if* + past perfect (*had known*).');
mc('condicionales', 'B1', 'What would you do if you ____ the lottery?', ['win', 'won', 'will win', 'would win'], 1, 'Segundo condicional: *if* + pasado simple.');
mc('condicionales', 'C1', '____ I known the truth, I would have said something.', ['If', 'Had', 'Were', 'Should'], 1, 'Inversión del tercer condicional: *Had I known* = *If I had known*.');
mc('condicionales', 'C1', 'If I ____ that job last year, I would be earning more now.', ['took', 'had taken', 'would take', 'have taken'], 1, 'Condicional mixto: *if* + past perfect (pasado) y *would* + infinitivo (presente).');

/* --- Preposiciones --- */
gp('prep', 'B1', "I'm looking forward ____ meeting you.", ['to'], '*Look forward to* + -ing. Aquí *to* es preposición.');
gp('prep', 'B1', 'It depends ____ the weather.', ['on'], '*Depend on*, no *of*.');
gp('prep', 'B1', "She's very good ____ languages.", ['at'], '*Good at* + sustantivo o -ing.');
gp('prep', 'B1', 'We arrived ____ the airport at six.', ['at'], '*Arrive at* un lugar concreto; *arrive in* una ciudad o un país.');
gp('prep', 'B1', "He's married ____ a doctor.", ['to'], '*Married to*, no *with*.');
gp('prep', 'A2', "I'll see you ____ Monday.", ['on'], '*On* + días.');
gp('prep', 'B1', "She's interested ____ photography.", ['in'], '*Interested in*.');
gp('prep', 'B1', "I'm afraid ____ spiders.", ['of'], '*Afraid of*.');
gp('prep', 'B1', 'Thanks for waiting ____ me.', ['for'], '*Wait for*.');
gp('prep', 'B2', "He's responsible ____ the project.", ['for'], '*Responsible for*.');
gp('prep', 'B1', "She's very proud ____ her daughter.", ['of'], '*Proud of*.');
gp('prep', 'A2', 'The meeting starts ____ 9 a.m.', ['at'], '*At* + horas.');
gp('prep', 'A2', 'I was born ____ 1998.', ['in'], '*In* + años, meses y estaciones.');

/* --- Phrasal verbs --- */
gp('phrasal', 'B1', "Don't give ____! You can do it.", ['up'], '*Give up* = rendirse.');
gp('phrasal', 'B1', 'We ran ____ milk, so I went to the shop.', ['out of'], '*Run out of* = quedarse sin.');
gp('phrasal', 'B1', 'She wants to take ____ yoga this autumn.', ['up'], '*Take up* = empezar una afición.');
gp('phrasal', 'B1', "Can you look ____ my cat while I'm away?", ['after'], '*Look after* = cuidar.');
gp('phrasal', 'B1', 'The meeting was put ____ until next week.', ['off'], '*Put off* = aplazar.');
gp('phrasal', 'B2', 'He came ____ with a brilliant idea.', ['up'], '*Come up with* = idear. El hueco es *up*; *with* ya está escrito.');
gp('phrasal', 'B2', "It's hard to get ____ with my neighbours: we never agree.", ['on', 'along'], '*Get on / get along with* = llevarse bien con.');
mc('phrasal', 'B2', '"It turned out that he was right." What does *turned out* mean?', ['he turned around', 'it finally proved to be the case', 'he went outside', 'he got angry'], 1, '*Turn out* = resultar, acabar siendo.');
gp('phrasal', 'B2', 'The concert was called ____ because of the storm.', ['off'], '*Call off* = cancelar.');
gp('phrasal', 'B2', 'I need to fill ____ this form before Friday.', ['in', 'out'], '*Fill in / fill out* = rellenar un formulario.');
gp('phrasal', 'B2', 'She is slowly getting ____ a bad cold.', ['over'], '*Get over* = recuperarse de.');

/* --- Colocaciones --- */
mc('colocaciones', 'B1', 'I need to ____ a decision soon.', ['do', 'make', 'take', 'have'], 1, '*Make a decision*. Igual que *make a mistake* o *make an effort*.');
mc('colocaciones', 'B1', 'She always ____ her best in exams.', ['makes', 'does', 'takes', 'keeps'], 1, '*Do your best*.');
mc('colocaciones', 'B1', 'Please ____ attention to the instructions.', ['make', 'pay', 'put', 'do'], 1, '*Pay attention*.');
mc('colocaciones', 'B1', "Let's ____ in touch after the course.", ['keep', 'hold', 'make', 'put'], 0, '*Keep in touch* = mantener el contacto.');
mc('colocaciones', 'B2', 'He ____ a big risk when he invested all his savings.', ['did', 'made', 'took', 'had'], 2, '*Take a risk*.');
mc('colocaciones', 'B1', "I'd like to ____ a complaint about the service.", ['do', 'make', 'tell', 'say'], 1, '*Make a complaint*.');
mc('colocaciones', 'B2', 'The team must ____ the deadline.', ['meet', 'catch', 'touch', 'arrive'], 0, '*Meet a deadline* = cumplir un plazo.');
mc('colocaciones', 'B2', 'After a long discussion, they finally ____ a conclusion.', ['arrived', 'reached', 'made', 'took'], 1, '*Reach a conclusion*. (*Arrive* necesitaría *at*.)');
mc('colocaciones', 'B1', 'I caught a bad ____ last week and stayed in bed.', ['cold', 'illness', 'health', 'hospital'], 0, '*Catch a cold*.');
mc('colocaciones', 'B2', 'She has ____ great progress since September.', ['done', 'made', 'taken', 'got'], 1, '*Make progress*.');
mc('colocaciones', 'B2', 'He ____ a promise and told everyone the secret.', ['broke', 'cracked', 'failed', 'lost'], 0, '*Break a promise*.');

/* --- Conectores --- */
mc('conectores', 'B1', '____ it was raining, we went for a walk.', ['Although', 'Despite', 'However', 'Because'], 0, '*Although* + sujeto + verbo. *Despite* va con sustantivo o -ing.');

const TTS = {

    const mal = /\bmale\b|david|mark|daniel|george|ryan|alex|oliver|brian|arthur|james/i;

    const pw = ((t.slice(Math.max(0, m.index - 14), m.index).match(/(\w+)\s+$/) || [])[1] || '').toLowerCase();
    if (!AUX.has(pw)) issues.push({ snip: m[1] + ' ' + m[2], msg: 'Con he/she/it: "has / goes / does".' });
  }

    passive: /\b(?:is|are|was|were|be|been|being)\s+(?:\w+ed|taken|given|seen|known|written|broken|chosen|driven|eaten|forgotten|hidden|spoken|stolen|worn|made|done|built|held|kept|sold|paid|found|told|left|lost|bought|brought|sent|shown)\b/i.test(t),
    relative: /\b(?:who|whom|whose|which|where)\b/i.test(t),

  if (p && p.part === 2 && n >= 60 && found.length < 4) tips.push('Usa más conectores variados (ahora ' + found.length + '). Meta: 4 o más.');
  if (p && p.part === 1 && n >= 30 && found.length < 2) tips.push('Añade 2 conectores sencillos (because, so, also, however).');

/* ===== Flashcards ===== */
const INTERVALS = [0, 10, 60, 360, 1440];
function deckStats(d) {
  const now = Date.now();
  let due = 0, known = 0;
  d.cards.forEach((c, i) => { const s = Store.d.cards[d.id + ':' + i]; if (!s || s.d <= now) due++; if (s && s.b >= 2) known++; });
  return { due, known, total: d.cards.length };
}
function startCards(ids, dir) {
  const now = Date.now();
  const pool = [];
  ids.forEach(id => { const d = DECKS.find(x => x.id === id); d.cards.forEach((c, i) => pool.push({ id: id + ':' + i, c, deck: d.title })); });
  let queue = shuffle(pool.filter(x => { const s = Store.d.cards[x.id]; return !s || s.d <= now; })).slice(0, 20);
  if (!queue.length) queue = shuffle(pool).slice(0, 20);
  go({ name: 'cards-run', queue, i: 0, flipped: false, dir, total: queue.length, know: 0, again: 0, req: {} });
}
